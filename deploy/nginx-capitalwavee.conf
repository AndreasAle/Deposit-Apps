# ============================================================================
# Nginx — Capital Wave (gabungan: App Laravel + phpMyAdmin)
# Simpan sebagai: /etc/nginx/sites-available/capitalwavee.com
# Aktifkan:       ln -s /etc/nginx/sites-available/capitalwavee.com /etc/nginx/sites-enabled/
# Tes & reload:   nginx -t && systemctl reload nginx
#
# PENTING: kalau sebelumnya sudah bikin file terpisah untuk phpMyAdmin,
# HAPUS symlink-nya dulu supaya server_name db.capitalwavee.com tidak dobel:
#   sudo rm -f /etc/nginx/sites-enabled/phpmyadmin
# ============================================================================

# ---------- APP: capitalwavee.com ----------
server {
    listen 80;
    listen [::]:80;
    server_name capitalwavee.com www.capitalwavee.com;

    root /var/www/capitalwave/public;
    index index.php index.html;
    charset utf-8;

    client_max_body_size 16M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.(?!well-known).* { deny all; }
}

# ---------- phpMyAdmin: db.capitalwavee.com ----------
server {
    listen 80;
    listen [::]:80;
    server_name db.capitalwavee.com;

    root /var/www/phpmyadmin;
    index index.php;
    charset utf-8;

    client_max_body_size 64M;

    # proteksi login (buat file: sudo htpasswd -c /etc/nginx/.htpasswd admin)
    auth_basic "Area Terbatas";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / { try_files $uri $uri/ =404; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ ^/(libraries|setup/lib|templates)/ { deny all; }
    location ~ /\. { deny all; }
}

# Catatan SSL:
#  - phpMyAdmin (langsung ke server):  sudo certbot --nginx -d db.capitalwavee.com
#  - Domain utama (capitalwavee.com) lewat Alibaba WAF: SSL biasanya di-handle WAF,
#    dan set ORIGIN server WAF -> 202.155.13.29. Kalau TIDAK lewat WAF, baru:
#    sudo certbot --nginx -d capitalwavee.com -d www.capitalwavee.com
