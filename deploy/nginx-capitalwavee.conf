# ============================================================================
# Nginx server block — Capital Wave (Laravel 12)
# Simpan sebagai: /etc/nginx/sites-available/capitalwavee.com
# Aktifkan:       ln -s /etc/nginx/sites-available/capitalwavee.com /etc/nginx/sites-enabled/
# Tes & reload:   nginx -t && systemctl reload nginx
# Root project git ada di: /var/www/capitalwave  (public/ = document root)
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name capitalwavee.com www.capitalwavee.com;

    root /var/www/capitalwave/public;
    index index.php index.html;
    charset utf-8;

    # upload forum media (maks 5MB per file, kasih longgar)
    client_max_body_size 16M;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # sesuaikan versi PHP (php8.2/8.3)
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # cache aset statis
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri /index.php?$query_string;
    }

    # blokir file tersembunyi (kecuali certbot .well-known)
    location ~ /\.(?!well-known).* { deny all; }
}

# Catatan: blok HTTPS (listen 443) akan DITAMBAHKAN OTOMATIS oleh certbot
# saat menjalankan:  certbot --nginx -d capitalwavee.com -d www.capitalwavee.com
