# ============================================================================
# Nginx untuk phpMyAdmin (server nginx-only, tanpa apache)
# Diakses via subdomain: https://db.capitalwavee.com
# Simpan: /etc/nginx/sites-available/phpmyadmin
# Aktifkan: ln -s /etc/nginx/sites-available/phpmyadmin /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx
#
# WAJIB: buat DNS A record  db.capitalwavee.com -> 202.155.13.29
# KEAMANAN: pakai HTTP Basic Auth + SSL (lihat panduan) supaya tidak
#           bisa diakses/di-bruteforce publik.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name db.capitalwavee.com;

    root /var/www/phpmyadmin;
    index index.php index.html;

    client_max_body_size 64M;   # supaya import SQL besar tetap lolos

    # --- Basic Auth (lapisan proteksi tambahan) ---
    auth_basic "Area Terbatas";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # sesuaikan versi PHP
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # jangan izinkan akses folder sensitif phpMyAdmin
    location ~ ^/(libraries|setup/lib|templates)/ { deny all; }
    location ~ /\. { deny all; }
}

# Blok HTTPS (443) akan ditambah otomatis oleh:
#   certbot --nginx -d db.capitalwavee.com
